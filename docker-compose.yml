services:
  postgres:
    image: postgres:15
    container_name: realtime-postgres
    environment:
      POSTGRES_DB: realtime_ranking
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d realtime_ranking"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: realtime-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "noeviction"]
    ports:
      - "6370:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    container_name: realtime-kafka
    environment:
      # KRaft 단일 노드: 브로커와 컨트롤러를 한 프로세스가 겸한다. ZooKeeper 없음.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 리스너 두 개: INTERNAL은 compose 네트워크 안(app 컨테이너)에서, EXTERNAL은 호스트(bootRun·테스트)에서 접속한다.
      # 클라이언트는 처음 붙은 뒤 브로커가 알려주는 접속 주소로 다시 연결한다. 접속 경로별로 그 주소가 달라야 양쪽 다 붙는다.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 단일 브로커이므로 복제 계수는 1이 강제된다.
      # 프로덕션에서는 acks=all + replication.factor>=3 + min.insync.replicas=2. 근거는 SPIKE-001.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 토픽은 relay/컨슈머 쪽에서 리텐션 설정과 함께 명시적으로 만든다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: realtime-api
    # relay 컨슈머 이름이 HOSTNAME이다. 명시하지 않으면 컨테이너 ID가 들어가고,
    # 컨테이너를 재생성할 때마다 이름이 바뀌어 이전 이름이 잡고 있던 미처리 항목이 주인 없이 남는다.
    hostname: realtime-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/realtime_ranking
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SNAPSHOTS_WORKER_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m"
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: realtime-prometheus
    depends_on:
      app:
        condition: service_started
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: realtime-grafana-renderer
    environment:
      AUTH_TOKEN: local-renderer-token

  grafana:
    image: grafana/grafana:12.2.0
    container_name: realtime-grafana
    depends_on:
      prometheus:
        condition: service_started
      renderer:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: local-renderer-token
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
