spring.application.name=RealtimeAPI

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/realtime_ranking
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Snapshot Worker ---
# Worker is opt-in by default. Enable it explicitly in a local profile or runtime args.
snapshots.worker.enabled=false
snapshots.worker.delay-ms=30000
snapshots.worker.top-n=1000
snapshots.worker.max-attempts=3
snapshots.worker.retry-delay-ms=5000
snapshots.recovery.enabled=true
snapshots.recovery.top-n=1000

# --- Kafka ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# acks=all: leader가 기록을 확정한 뒤에만 성공으로 본다. 단일 브로커라 지금은 acks=1과 같지만,
# 복제를 붙이면 이 설정이 곧 유실 0의 조건이 된다(SPIKE-001).
spring.kafka.producer.acks=all
# 추이 집계 컨슈머. auto-commit 끄면 컨테이너가 배치 처리 후 오프셋을 커밋한다(처리 후 커밋).
# 배치 크기 = max-poll-records(개수)와 poll 주기(시간) 중 먼저 걸리는 쪽.
spring.kafka.consumer.group-id=audit-trend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=500
spring.kafka.listener.type=batch
spring.kafka.listener.ack-mode=batch
# 실패 레코드를 배치 단위로 재검증하므로 500건이 모두 깨져도 총 대기는 6초다.
events.consumer.parse-retry-delay-ms=3000
# DB 연결·자원·일시 오류만 같은 배치로 무기한 재시도한다. 각 구간의 50~100% jitter로 다중 컨슈머 동시 재시도를 피한다.
events.consumer.db-retry-initial-delay=10s
events.consumer.db-retry-max-delay=5m
events.consumer.db-retry-unhealthy-after=10m
# audit_events 일 단위(UTC) 파티션. 30일 지난 날짜 파티션은 DROP하고, 오늘과 그 뒤 3일 파티션을 미리 만든다.
# 앞당김 3일: 파티션 잡이 주말 내내 실패해도 적재가 멈추지 않는 여유.
events.consumer.partition-retention-days=30
events.consumer.partition-ahead-days=3

# --- Audit Relay Worker ---
# Redis audit stream(outbox) → Kafka로 옮기는 relay. 기본 off, 로컬에서 켠다.
events.relay.enabled=false
events.relay.delay-ms=5000
events.relay.batch-size=500
events.relay.consumer-name=${EVENTS_RELAY_CONSUMER_NAME:${HOSTNAME:relay-local}}
# 트림은 relay보다 느린 주기로 따로 돈다. 매 relay 틱마다 트림하면 왕복이 배로 는다.
events.relay.trim-delay-ms=40000

# --- Scheduler Shutdown ---
# spring.task.scheduling.shutdown.await-termination은 일부러 켜지 않는다(기본 false).
# Spring 6.1+ 기본 동작은 종료 시 스케줄러를 먼저 멈추고, 실행 중인 틱(릴레이 배치)이 끝날 때까지 기다린 뒤
# Redis(phase 0)·Kafka 프로듀서를 내린다. 대기 상한은 spring.lifecycle.timeout-per-shutdown-phase(기본 30s).
# await-termination=true면 이 대기를 건너뛰어 배치 도중 Redis·Kafka가 먼저 닫힌다(SchedulerShutdownOrderTest).

# --- Redis ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6370}
# PRD 10 기준으로 Redis 장애 시 fail-fast 해야 하므로,
# local/dev 기본값도 연결/명령 타임아웃을 짧게 둔다.
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# --- Admin Auth (JWT) ---
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:local-dev-admin-jwt-secret-change-me}
app.auth.jwt.ttl-seconds=3600
# 관리자 계정은 기동 시 이 값으로만 시드한다. 비밀번호가 비어 있으면 관리자를 만들지 않는다(기본값 없음).
app.admin.bootstrap.username=${APP_ADMIN_BOOTSTRAP_USERNAME:admin}
app.admin.bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}

# --- Hot Path Optimizations ---
app.api-key.cache-ttl=1m
app.usage-stats.flush-delay-ms=1000
app.usage-stats.flush-initial-delay-ms=1000

# --- Redis Hot Path Circuit Breaker ---
events.circuit-breaker.sliding-window-size=10
events.circuit-breaker.failure-rate-threshold=50
events.circuit-breaker.wait-duration-in-open-state=10s
events.circuit-breaker.permitted-calls-in-half-open-state=3

# --- Actuator / Prometheus ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,auditConsumer
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
