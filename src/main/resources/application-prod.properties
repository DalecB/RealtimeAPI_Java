# 운영 프로필. application.properties의 개발용 자격증명(app/app, local-dev JWT)을 덮어써서 그대로 뜨지 못하게 한다.
# 기본값 없는 placeholder라 환경 변수가 없으면 ProdRequiredPropertiesCheck가 기동을 막는다.
# 환경 변수가 있으면 relaxed binding으로 이 파일보다 먼저 읽힌다.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET}

# Spring Security가 없어 when-authorized는 사실상 상세 비공개다. 콘솔의 Redis/Postgres 칩은 운영에서 DOWN으로 보인다.
# 상태(UP/DOWN)와 /actuator/health/readiness·liveness 프로브 응답 코드는 그대로 동작한다.
management.endpoint.health.show-details=when-authorized
