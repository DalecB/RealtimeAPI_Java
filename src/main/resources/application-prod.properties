# 개발용 자격증명을 기본값 없는 placeholder로 덮어, 환경 변수가 없으면 ProdRequiredPropertiesCheck가 기동을 막는다.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET}

# Spring Security가 없어 when-authorized는 상세 비공개와 같다. 콘솔의 Redis/Postgres 칩은 DOWN으로 보이지만 상태·프로브 응답 코드는 정상이다.
management.endpoint.health.show-details=when-authorized
